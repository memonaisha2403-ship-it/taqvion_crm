<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TAQVION Nexus</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#020B2D;--deep:#0B1F3A;--cy:#00D9F5;--tq:#08CDE5;--bg:#F4F7FB;--card:#fff;--tx:#0B1F3A;--mut:#5b6b82;--line:#E6ECF3;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#061230;--card:#0B1F3A;--tx:#E9F1FA;--mut:#93a4bd;--line:#1a3358;--in:#07162f}}
:root[data-theme="dark"]{--bg:#061230;--card:#0B1F3A;--tx:#E9F1FA;--mut:#93a4bd;--line:#1a3358;--in:#07162f}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*{box-sizing:border-box}
body{margin:0;height:100%;display:flex;background:var(--bg);color:var(--tx);font:14px/1.45 Manrope,system-ui,sans-serif}
#side{width:236px;background:var(--navy);color:#cfe3f3;display:flex;flex-direction:column;padding:14px 10px;flex:none;transition:width .2s;border-right:1px solid #0e2a55}
#side img{display:block}#side .lock{width:100%;border-radius:6px}#side .mark{display:none;width:40px;margin:0 auto;border-radius:6px}
#side.mini{width:72px}#side.mini .lock,#side.mini .t{display:none}#side.mini .mark{display:block}
#side a{display:flex;gap:11px;align-items:center;padding:10px 12px;margin:2px 0;border-radius:8px;color:#9fb6cf;text-decoration:none;font-weight:600;border-left:3px solid transparent}
#side a:hover{background:#0B1F3A;color:#fff}#side a.on{background:#0B1F3A;color:var(--cy);border-left-color:var(--cy);box-shadow:0 0 14px #00d9f51f}
#side svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#side nav{flex:1;margin-top:16px;overflow:auto}.me{font-size:12px;color:#7f98b5;padding:8px 12px;border-top:1px solid #12305c}
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
header{display:flex;gap:10px;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);position:relative}
#crumb{font-weight:700;margin-right:auto;white-space:nowrap}
#gsw{position:relative;width:min(340px,40vw)}#sr{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px #020b2d33;z-index:30;max-height:320px;overflow:auto}
#sr div{padding:8px 12px;cursor:pointer}#sr div:hover{background:var(--bg)}#sr small,small{color:var(--mut);display:block}
input,select,textarea{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--tq);outline-offset:1px}
.btn{background:var(--deep);color:#fff;border:1px solid var(--cy);border-radius:8px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap;width:auto}
.btn:hover{box-shadow:0 0 12px #00d9f566}.gh{background:transparent;color:var(--tx);border-color:var(--line)}.gh:hover{box-shadow:none;border-color:var(--tq)}.dng{background:#b42318;border-color:#b42318}
.ic{background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 10px;cursor:pointer;font:inherit}
#qw{position:relative}#qm{display:none;position:absolute;right:0;top:110%;background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:160px;z-index:30;box-shadow:0 12px 30px #020b2d33}#qm.open{display:block}
#qm button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:9px 14px;font:inherit;cursor:pointer}#qm button:hover{background:var(--bg)}
#view{padding:20px;overflow:auto;flex:1}h2{margin:0 0 4px;font-size:22px}h3{margin:0 0 12px;font-size:15px}h4{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin:14px 0}
.kpi b{display:block;font-size:22px;margin-top:4px}.kpi span,.sub{color:var(--mut);font-size:12.5px}.kpi{border-top:2px solid var(--tq)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}
.cols{display:flex;align-items:flex-end;gap:10px;height:150px}.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut);text-align:center}.cols i{display:block;width:100%;background:linear-gradient(var(--cy),var(--tq));border-radius:5px 5px 0 0;min-height:2px}
.hb{display:grid;grid-template-columns:120px 1fr auto;gap:8px;align-items:center;margin:7px 0;font-size:12.5px}.hb i{display:block;height:8px;border-radius:4px;background:var(--tq)}.hb u{display:block;background:var(--line);border-radius:4px;text-decoration:none}
.li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.bar{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;align-items:center}.bar input{max-width:300px}.bar select{max-width:200px}.bar .btn{margin-left:auto}
.tw{padding:0;overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}th{text-align:left;font-size:12px;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border:0}
td .ic{padding:4px 8px;font-size:12px;margin-right:4px}.empty{padding:34px;text-align:center;color:var(--mut)}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#e3eefb;color:#16508f}.t-g{background:#d9f7ec;color:#0a6b4b}.t-w{background:#fff1d1;color:#8a5a00}.t-r{background:#fde2e0;color:#a3231a}.t-n{background:var(--line);color:var(--mut)}
.pg{height:7px;background:var(--line);border-radius:4px;min-width:80px}.pg i{display:block;height:100%;background:var(--tq);border-radius:4px}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}.col{flex:0 0 220px;background:var(--line);border-radius:12px;padding:10px;min-height:200px}.col.ov{outline:2px dashed var(--tq)}.col h4{display:flex;justify-content:space-between;font-size:13px}.col h4 i{font-style:normal;color:var(--mut)}
.kc{background:var(--card);border-radius:9px;padding:10px;margin-top:8px;cursor:grab;border:1px solid var(--line);font-size:13px}.kc .row{display:flex;justify-content:space-between;margin-top:6px;color:var(--mut);font-size:12px}
#ov{position:fixed;inset:0;background:#020b2d99;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}#ov.open{display:flex}
#ov form{background:var(--card);border-radius:14px;padding:20px;width:min(560px,100%);max-height:90%;overflow:auto;border-top:3px solid var(--cy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid label{font-size:12.5px;color:var(--mut);font-weight:600}.grid label input,.grid label select,.grid label textarea{margin-top:3px;color:var(--tx);font-weight:400}.full{grid-column:1/-1}
#err{color:#c0392b;min-height:20px;margin:8px 0;font-size:13px}.acts{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;border:1px solid var(--cy);padding:9px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}#toast.on{opacity:1}
.note{background:#e9fbff;border:1px solid #9be9f5;color:#0B1F3A;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#mb{display:none}
@media(max-width:860px){#side{position:fixed;z-index:40;height:100%;transform:translateX(-100%)}#side.open{transform:none}#mb{display:block}.grid{grid-template-columns:1fr}#gsw{width:auto;flex:1}#crumb{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

 else if(a==='pay'){const i=S.invoices.find(x=>x.id===id);modal('Record payment for '+i.code,`<div class="grid"><label>Amount (₹) — balance ${inr(bal(i))}<input name="amt" type="number" min="1" step="any" required value="${bal(i)}"></label><label>Date<input name="d" type="date" value="${today()}" required></label></div>`,o=>{const m=+o.amt;if(!(m>0)||m>bal(i))return'Enter an amount between 1 and the outstanding balance.';(i.pay=i.pay||[]).push({d:o.d,amt:m});if(i.state==='Draft')i.state='Sent';lg(`Recorded ${inr(m)} on ${i.code}`);save();render();toast('Payment recorded')},'Record payment')}
 else if(a==='q'){$('#qm').innerHTML=Object.keys(ENT).map(k=>`<button data-a="new" data-k="${k}">New ${ENT[k].t.toLowerCase()}</button>`).join('');$('#qm').classList.toggle('open')}
 else if(a==='theme'){const r=document.documentElement,d=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';r.dataset.theme=d?'light':'dark'}
 else if(a==='side')$('#side').classList.toggle('open');else if(a==='mini')$('#side').classList.toggle('mini');
 else if(a==='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='taqvion-nexus-backup.json';l.click();toast('Backup downloaded')}
 else if(a==='demo')modal('Remove demo data?','<p>All sample records are deleted. Records you created stay.</p>',()=>{['leads','clients','projects','tasks','invoices'].forEach(k=>S[k]=S[k].filter(x=>!x.demo));S.demo=0;lg('Demo data removed');save();render();toast('Demo data removed')},'Remove');
 else if(a==='reset')modal('Erase all data?','<p>Every record in this workspace is deleted, including your own. This cannot be undone.</p>',()=>{S=seed();['leads','clients','projects','tasks','invoices'].forEach(k=>S[k]=[]);S.seq={leads:0,clients:0,projects:0,tasks:0,invoices:0};S.demo=0;S.log=[];save();render();toast('Workspace cleared')},'Erase everything')});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){Q[R]=t.value;$('#tb').innerHTML=tbl(R)}else if(t.id==='gs'){const q=t.value.trim().toLowerCase(),sr=$('#sr');if(!q){sr.hidden=true;return}const h=[];Object.keys(ENT).forEach(k=>S[k].forEach(r=>{if(JSON.stringify(Object.values(r)).toLowerCase().includes(q))h.push(`<div data-a="go" data-k="${k}" data-id="${r.id}">${esc(r.name||r.title||r.code)}<small>${ENT[k].t} ${r.code}</small></div>`)}));sr.innerHTML=h.slice(0,8).join('')||'<div>No results</div>';sr.hidden=false}});
document.addEventListener('change',e=>{if(e.target.id==='fl'){F[R]=e.target.value;$('#tb').innerHTML=tbl(R)}});
document.addEventListener('submit',e=>{if(e.target.id==='cf'){e.preventDefault();Object.assign(S.company,Object.fromEntries(new FormData(e.target)));lg('Company profile updated');save();render();toast('Profile saved')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#ov').classList.remove('open');if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#gs').focus()}});
let drag;document.addEventListener('dragstart',e=>{const c=e.target.closest('.kc');if(c){drag=c.dataset.id;e.dataTransfer.setData('text/plain',drag)}});
document.addEventListener('dragover',e=>{const c=e.target.closest('.col');if(c&&drag){e.preventDefault();document.querySelectorAll('.ov').forEach(x=>x.classList.remove('ov'));c.classList.add('ov')}});
document.addEventListener('drop',e=>{const c=e.target.closest('.col');if(c&&drag){e.preventDefault();const l=S.leads.find(x=>x.id===drag);if(l.status!==c.dataset.s){lg(`Moved ${l.code} from ${l.status} to ${c.dataset.s}`);l.status=c.dataset.s;save();toast('Moved to '+l.status)}drag=null;render()}});
document.addEventListener('click',e=>{const c=e.target.closest('.kc');if(c)openForm('leads',c.dataset.id)});
addEventListener('hashchange',render);render();
</script></body></html>
